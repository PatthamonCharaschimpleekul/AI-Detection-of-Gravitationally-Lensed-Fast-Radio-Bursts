<style>@page { size: 7.16in 2.14in; margin: 0; } /* Shared style for the paper diagrams. Units: the SVG viewBox uses 1 unit = 0.01 in, so 11 units ~ 8 pt. */

.tag { fill: var(--ink); font-size: 11px; font-weight: bold; }
